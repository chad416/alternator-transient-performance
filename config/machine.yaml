# Reference machine: a generic 800 kVA low-voltage brushless alternator.
# Every geometric value is a design choice made in this study (see DOSSIER.md §6.1 and docs/design_notes.md).
# Nothing here is the data of a real product.

rating:
  s_kva: 800.0          # apparent power
  u_ll: 400.0           # line voltage, star connection
  f_hz: 50.0
  poles: 4
  pf: 0.8               # lagging
  t_amb_c: 40.0
  t_wind_c: 115.0       # reference winding temperature for resistance (class H machine at class F rise)

stator:
  d_bore: 0.540         # m
  d_out: 0.820          # m
  l_core: 0.430         # m, gross core length
  k_stack: 0.97
  slots: 48
  slot_width: 0.014     # parallel-sided, semi-closed
  slot_depth: 0.058     # total, including tip and wedge
  slot_open: 0.004
  tip_height: 0.0015
  wedge_height: 0.003
  coil_pitch_slots: 8   # full pitch = 12 → 2/3 pitch removes the 3rd harmonic
  turns_per_coil: 3
  parallel_paths: 4
  layers: 2
  fill_factor: 0.45
  end_turn_length: 0.42       # m, length of one end connection of one turn (one end)
  lambda_end: 0.30            # end-winding permeance factor (Pyrhönen, ch. 4, typical 0.2–0.5)
  skew_slots: 0.0             # stator not skewed; the damper bars are staggered instead (see rotor.damper)

rotor:
  air_gap_min: 0.0040         # at pole centre
  pole_arc_ratio: 0.68        # alpha_p = pole arc / pole pitch
  pole_profile: cosine        # delta(theta_e) = delta0 / cos(theta_e) under the pole
  pole_body_width: 0.160
  pole_shoe_height_edge: 0.020
  pole_body_height: 0.085
  hub_radius: 0.155           # magnetic hub including shaft
  field_turns_per_pole: 120
  field_conductor_area_mm2: 15.0    # edge-wound copper strip, coil fill 0.75 [A]; fits the 2-D section (bta/geometry.py)
  field_coil_width: 0.040     # tangential width of one coil side
  field_coil_height: 0.060
  damper:
    bars_per_pole: 9           # 8 bar pitches = 83 % of the pole arc (decision D17; 6 bars covered only 52 %)
    bar_diameter: 0.010
    bar_depth: 0.003          # copper from bar top to pole surface (slot bridge)
    bar_slot_open: 0.002
    bar_pitch_ratio: 0.85     # bar pitch / stator slot pitch (not equal, to avoid slot-harmonic locking)
    bar_material: copper
    end_ring_area_mm2: 400.0

steel:
  # Typical non-oriented 50 Hz lamination steel, approximate B-H points (B in T, H in A/m).
  # Used by the analytic magnetic circuit. FEMM runs use the FEMM library material "M-19 Steel".
  bh:
    - [0.0, 0.0]
    - [0.5, 60.0]
    - [0.8, 90.0]
    - [1.0, 120.0]
    - [1.2, 170.0]
    - [1.3, 220.0]
    - [1.4, 330.0]
    - [1.5, 620.0]
    - [1.6, 1500.0]
    - [1.7, 3500.0]
    - [1.8, 7500.0]
    - [1.9, 13000.0]
    - [2.0, 22000.0]
    - [2.1, 40000.0]
    - [2.3, 150000.0]

copper:
  rho_20: 1.72e-8       # ohm·m (IEC 60028 annealed copper)
  alpha_20: 0.00393

mech:
  # Inertia constant of the whole generating set on the alternator kVA base (engine + flywheel + rotor).
  # Assumed: LV diesel sets are typically 0.5–1.5 s. Varied in the sensitivity study.
  h_set_s: 0.8
